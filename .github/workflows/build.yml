name: Build LSPosed APK
on:
  workflow_dispatch:
  push:
    paths: ['app/**', 'build.gradle', 'settings.gradle', 'gradle.properties', '.github/workflows/build.yml']
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install Android 36 SDK
        run: sdkmanager 'platforms;android-36'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Rebuild Xposed API stubs for Java 17
        run: |
          rm -rf stubs/build
          mkdir -p stubs/build
          find stubs/src -name '*.java' -print0 | xargs -0 javac --release 17 -d stubs/build
          jar --create --file app/libs/xposed-api-stubs.jar -C stubs/build .
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BrightnessLink-LSPosed-debug-apk
          path: app/build/outputs/apk/debug/*.apk
